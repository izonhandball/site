name: Synchro Instagram

# Chaque nuit : récupère les derniers posts de @hbcizon, commite les changements
# (posts.json + images), puis enchaîne sur le workflow Site (vérification et déploiement).
# Ce déploiement quotidien retire aussi les Match Day expirés, même sans nouveau post.
# Tant que data/instagram/token.enc n'existe pas (pnpm ig:init), le job ne fait rien.

on:
  schedule:
    # Une fois par jour vers 4h, heure de Paris (2h UTC = 4h l'été, 3h l'hiver).
    # GitHub peut décaler l'exécution de quelques minutes.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'izonhandball/site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Jeton présent ?
        id: jeton
        run: test -f data/instagram/token.enc && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "::notice::Pas encore de jeton Instagram (pnpm ig:init)."
      - if: steps.jeton.outputs.ok == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.jeton.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.jeton.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.jeton.outputs.ok == 'true'
        run: pnpm ig:sync
        env:
          IG_KEY: ${{ secrets.IG_KEY }}
      - if: steps.jeton.outputs.ok == 'true'
        name: Commit des changements
        run: |
          git add data/instagram/posts.json public/instagram
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "instagram : synchro des posts"
          git pull --rebase
          git push

  # Un push fait avec GITHUB_TOKEN ne déclenche pas les autres workflows : le site est
  # vérifié et déployé ici, même si la synchro a échoué (avec les derniers posts connus).
  site:
    needs: sync
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/site.yml
    secrets: inherit
