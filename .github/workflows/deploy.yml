name: Déploiement

# Build du site et déploiement sur Cloudflare Workers.
# - à chaque push sur main (modifications de code ou via Decap) ;
# - après une synchro Instagram qui a changé quelque chose (déclenché par sync-instagram.yml) ;
# - chaque nuit, pour retirer un Match Day expiré même sans nouveau post.
# Sans les secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, le job s'arrête sans erreur.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: deploiement
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'izonhandball/site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets Cloudflare présents ?
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets Cloudflare absents : pas de déploiement."
          fi
      - if: steps.cf.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.cf.outputs.ok == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.cf.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.cf.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.cf.outputs.ok == 'true'
        run: pnpm build
      - if: steps.cf.outputs.ok == 'true'
        run: pnpm exec wrangler deploy
